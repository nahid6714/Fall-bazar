name: Build and publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$HOME/.android/debug.keystore"

      - name: Check Kotlin compilation
        shell: bash
        run: |
          set -u
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Kotlin compile check attempt $attempt/$max_attempts"
            if gradle :app:compileReleaseKotlin --no-daemon --stacktrace; then
              echo "Kotlin compilation check passed."
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Kotlin compilation check failed."
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
            -Dorg.gradle.internal.repository.max.retries=5
        shell: bash
        run: |
          set -u
          max_attempts=5
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Gradle build attempt $attempt/$max_attempts"
            if gradle assembleRelease --no-daemon --stacktrace; then
              echo "Gradle build succeeded."
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Gradle build failed after $max_attempts attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Sign and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Gradle did not produce an APK."
            find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$HOME/.android/debug.keystore"
          SIGNED_APK="app/build/outputs/apk/release/FolBazar-Admin-${GITHUB_RUN_NUMBER}.apk"

          # Normalize the APK first.
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" /tmp/aligned.apk

          # Explicitly sign the APK. This avoids relying only on Gradle's
          # signingConfig and guarantees an installable APK for this demo build.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            /tmp/aligned.apk

          # Verify the APK with apksigner only.
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

          # Confirm it is a real ZIP/APK and report its size.
          unzip -tq "$SIGNED_APK" >/dev/null
          test -s "$SIGNED_APK"

          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          echo "APK signing and verification succeeded."
          ls -lh "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fol-bazar-admin-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
          RELEASE_TITLE: Fol Bazar Admin v1.0.${{ github.run_number }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Release tag: ${RELEASE_TAG}"
          echo "APK: ${APK_PATH}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${APK_PATH}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --latest
          else
            gh release create "${RELEASE_TAG}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              --latest
          fi

          echo "GitHub Release published successfully."
