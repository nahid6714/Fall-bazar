name: Build and publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 GitHub Secret is required for updateable releases."
            echo "The same signing key must be used for every APK update."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
          test -s "$GITHUB_WORKSPACE/release-key.jks"

      - name: Check Kotlin compilation
        shell: bash
        run: |
          set -u
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Kotlin compile check attempt $attempt/$max_attempts"
            if gradle :app:compileReleaseKotlin --no-daemon --stacktrace; then
              echo "Kotlin compilation check passed."
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Kotlin compilation check failed."
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
            -Dorg.gradle.internal.repository.max.retries=5
        shell: bash
        run: |
          set -u
          max_attempts=5
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Gradle build attempt $attempt/$max_attempts"
            if gradle assembleRelease --no-daemon --stacktrace; then
              echo "Gradle build succeeded."
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Gradle build failed after $max_attempts attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Sign and verify APK
        id: apk
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Gradle did not produce an APK."
            find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
            exit 1
          fi

          if [ -z "${KEYSTORE_STORE_PASSWORD:-}" ] || [ -z "${KEYSTORE_KEY_PASSWORD:-}" ] || [ -z "${KEYSTORE_ALIAS:-}" ]; then
            echo "ERROR: KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD and KEYSTORE_KEY_ALIAS secrets are required."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$GITHUB_WORKSPACE/release-key.jks"
          SIGNED_APK="app/build/outputs/apk/release/FolBazar-Admin-${GITHUB_RUN_NUMBER}.apk"

          # Normalize the APK first.
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" /tmp/aligned.apk

          # Explicitly sign the APK. This avoids relying only on Gradle's
          # signingConfig and guarantees an installable APK for this demo build.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "env:KEYSTORE_STORE_PASSWORD" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --key-pass "env:KEYSTORE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            /tmp/aligned.apk

          # Verify the APK with apksigner and Android build tools.
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

          # Confirm it is a real ZIP/APK and contains the binary Android manifest.
          unzip -tq "$SIGNED_APK" >/dev/null
          unzip -l "$SIGNED_APK" | grep -q "AndroidManifest.xml"
          test -s "$SIGNED_APK"
          echo "Verified APK size: $(stat -c%s "$SIGNED_APK") bytes"

          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          echo "APK signing and verification succeeded."
          ls -lh "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fol-bazar-admin-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
          RELEASE_TITLE: Fol Bazar Admin v1.0.${{ github.run_number }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Release tag: ${RELEASE_TAG}"
          echo "APK: ${APK_PATH}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${APK_PATH}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --latest
          else
            gh release create "${RELEASE_TAG}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              --latest
          fi

          # Publish a small update manifest as a GitHub Release asset.
          # The Android app reads this JSON instead of calling the GitHub API,
          # avoiding API-rate-limit issues during normal update checks.
          cat > update.json <<EOF
          {
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "1.0.${GITHUB_RUN_NUMBER}",
            "releaseName": "${RELEASE_TITLE}",
            "downloadUrl": "https://github.com/nahid6714/Fall-bazar/releases/download/${RELEASE_TAG}/FolBazar-Admin-${GITHUB_RUN_NUMBER}.apk",
            "releaseUrl": "https://github.com/nahid6714/Fall-bazar/releases/tag/${RELEASE_TAG}"
          }
          EOF

          gh release upload "${RELEASE_TAG}" update.json --clobber
          echo "GitHub Release published successfully, including update.json."
