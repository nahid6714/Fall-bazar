name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate and prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            echo "Release output directory:"
            find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
            exit 1
          fi

          VERSION_NAME="$(grep -o 'versionName="[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2 || true)"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi

          RELEASE_APK="app/build/outputs/apk/release/FolBazar-Admin-v${VERSION_NAME}.apk"
          cp "$APK" "$RELEASE_APK"

          echo "apk_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          echo "APK found:"
          ls -lh "$APK"
          echo "Release APK:"
          ls -lh "$RELEASE_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fol-bazar-admin-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.apk.outputs.release_tag }}"
          APK="${{ steps.apk.outputs.apk_path }}"
          echo "Publishing GitHub Release: $TAG"
          echo "APK: $APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "ফল বাজার Admin $TAG" \
              --generate-notes \
              --latest
          fi
