name: Build and publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Gradle did not produce an APK."
            find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
            exit 1
          fi

          RELEASE_APK="app/build/outputs/apk/release/FolBazar-Admin-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$RELEASE_APK"

          echo "apk_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$RELEASE_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fol-bazar-admin-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
          RELEASE_TITLE: Fol Bazar Admin v1.0.${{ github.run_number }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Release tag: ${RELEASE_TAG}"
          echo "APK: ${APK_PATH}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists; replacing APK..."
            gh release upload "${RELEASE_TAG}" "${APK_PATH}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --latest
          else
            echo "Creating GitHub Release..."
            gh release create "${RELEASE_TAG}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              --latest
          fi

          echo "GitHub Release published successfully."
