name: Build & Release APK

# প্রতিবার main ব্রাঞ্চে পুশ করলে এই ওয়ার্কফ্লো নিজে থেকে চলবে,
# এবং APK বানিয়ে GitHub Releases এ আপলোড করে দিবে।
# চাইলে Actions ট্যাব থেকে ম্যানুয়ালিও (Run workflow) চালানো যাবে।
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          accept-android-sdk-licenses: true

      # প্রজেক্টে gradlew ফাইল নেই, তাই সরাসরি Gradle ইন্সটল করে ব্যবহার করা হচ্ছে
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # রিলিজ APK সাইন করার জন্য গোপন কীস্টোর, রিপোজিটরির GitHub Secrets থেকে আসবে
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_BASE64 secret পাওয়া যায়নি। Repo Settings > Secrets and variables > Actions এ গিয়ে যোগ করুন।"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace -PappBuildNumber=${{ github.run_number }}

      - name: Locate & rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ কোনো APK ফাইল পাওয়া যায়নি।"
            exit 1
          fi
          OUT_NAME="BusTerminalBdAdmin-build${{ github.run_number }}.apk"
          cp "$APK_PATH" "$OUT_NAME"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Bus Terminal BD Admin - Build #${{ github.run_number }}"
          body: |
            কমিট থেকে অটোমেটিক তৈরি: ${{ github.sha }}

            নিচের APK ফাইলটি ডাউনলোড করে ফোনে ইন্সটল করুন (প্রথমবার "Install unknown apps" পারমিশন দিতে হতে পারে)।
          files: ${{ steps.apk.outputs.name }}
