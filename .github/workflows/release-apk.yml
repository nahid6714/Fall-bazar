name: Build & Release APK (Manual)

# The repository also has release.yml, which is the single automatic APK workflow.
# This legacy workflow is intentionally manual-only to prevent two builds per push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow disabled
        run: |
          echo "This legacy workflow is manual-only."
          echo "Use .github/workflows/release.yml for automatic APK builds."
