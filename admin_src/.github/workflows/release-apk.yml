name: Build & Release APK (Manual Legacy)

# The automatic APK workflow is release.yml.
# This legacy workflow is manual-only so one push creates only one APK build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow notice
        run: |
          echo "Legacy automatic APK workflow is disabled."
          echo "Use .github/workflows/release.yml for the automatic build."
